name = "builder-launcher"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
account_id = "86a07961d3e206d175277440ca16a931"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "builder-launcher"
database_id = "af8c29f3-f585-4bd7-9a59-94f272db1104"

[[r2_buckets]]
binding = "VAULT"
bucket_name = "builder-launcher-vaults"
