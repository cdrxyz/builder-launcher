<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Builder Launcher mark</title>
  <style>
    body { margin: 0; background: #111; color: #ddd; font-family: Helvetica, Arial, sans-serif; }
    h1 { font-size: 16px; letter-spacing: 2px; font-weight: 500; padding: 24px 24px 0; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; padding: 24px; max-width: 960px; }
    .card { background: #1a1a1a; border-radius: 8px; padding: 16px; }
    .card-label { font-size: 12px; color: #888; margin-bottom: 12px; letter-spacing: 1px; }
    .card-img { display: flex; align-items: center; justify-content: center; min-height: 220px; }
    .card-img img { max-width: 100%; height: auto; }
    .wide { grid-column: 1 / -1; }
  </style>
</head>
<body>
  <h1>BUILDER LAUNCHER — B IN GEAR</h1>
  <div class="grid">
    <div class="card">
      <div class="card-label">MARK — INK</div>
      <div class="card-img"><img src="mark.svg" alt="dark mark" width="240" height="240"></div>
    </div>
    <div class="card">
      <div class="card-label">MARK — PAPER</div>
      <div class="card-img"><img src="mark-light.svg" alt="light mark" width="240" height="240"></div>
    </div>
    <div class="card">
      <div class="card-label">ICON — TRANSPARENT</div>
      <div class="card-img" style="background: repeating-conic-gradient(#333 0% 25%, #222 0% 50%) 50% / 16px 16px;"><img src="icon.svg" alt="icon" width="240" height="240"></div>
    </div>
    <div class="card wide">
      <div class="card-label">HORIZONTAL</div>
      <div class="card-img"><img src="horizontal.svg" alt="wordmark" width="640"></div>
    </div>
  </div>
</body>
</html>
