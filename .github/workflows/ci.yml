name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: android-actions/setup-android@v3

      - uses: cashapp/activate-hermit@v1
        with:
          cache: "true"

      - name: Prepare keystore
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SECRET_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SECRET_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KS="$GITHUB_WORKSPACE/builder-launcher.p12"
          if [ -z "${ANDROID_KEYSTORE_B64:-}" ]; then
            echo "ANDROID_KEYSTORE_B64 secret is required; refusing a well-known CI keystore."
            exit 1
          fi
          if [ -z "${SECRET_KEY_ALIAS:-}" ]; then
            echo "ANDROID_KEY_ALIAS secret is required."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$KS"
          echo "ANDROID_KEYSTORE_PASSWORD=${SECRET_STORE_PASSWORD}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=${SECRET_KEY_PASSWORD}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=${SECRET_KEY_ALIAS}" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"

      - name: Test and assemble
        run: gradle :app:testDebugUnitTest :app:verifyPaparazziDebug :app:assembleRelease --no-daemon --stacktrace

      - name: Upload Paparazzi failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: paparazzi-failures
          path: app/build/paparazzi
          if-no-files-found: ignore

      - name: Stage APK
        run: |
          set -euo pipefail
          mkdir -p dist
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$APK" dist/builder-launcher-release.apk
          ls -la dist/builder-launcher-release.apk

      - uses: actions/upload-artifact@v7
        with:
          name: builder-launcher-release
          path: dist/builder-launcher-release.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            TAG="pr-${{ github.event.pull_request.number }}"
            NOTES="PR #${{ github.event.pull_request.number }} (${GITHUB_SHA})"
            TITLE="PR #${{ github.event.pull_request.number }}"
            gh release delete "$TAG" --yes || true
            git push origin ":refs/tags/$TAG" || true
            gh release create "$TAG" dist/builder-launcher-release.apk --prerelease --title "$TITLE" --notes "$NOTES"
          else
            TAG="v0.1.${GITHUB_RUN_NUMBER}"
            gh release create "$TAG" dist/builder-launcher-release.apk --latest --title "$TAG" --notes "master ${GITHUB_SHA}"
          fi
